# Toxive Jr keyword replies. The bot reloads this file automatically when it changes.
#
# Triggers (an entry fires if ANY of them match):
#   words:    whole words, case-insensitive, punctuation ignored    words: [val, valorant]
#   contains: text anywhere in the message, case-insensitive        contains: [one piece]
#   exact:    the whole message, case-sensitive                     exact: ["Junior?"]
#   regex:    a regular expression, case-insensitive                regex: '^hi+\b'
#
# What to send:
#   text: some text or a gif link
#   file: an image/gif in the bot folder (or media/)
#   mode: reply (default, replies to the message) or send (plain message in the channel)
#   echo: true sends the user's own message back
#   random: a list of options (each with text/file/mode and an optional weight); one is picked
#   actions: a list of things to send, in order
#   unless_contains: skip an action if the message contains this text
#
# Conditions:
#   only_users / except_users: Discord usernames
#   hours: [start, end] in 24h time, e.g. [20, 7] means 8pm until 7am
#   chance: 0.0-1.0 probability of firing when triggered
#   mute: false stops this reply from muting the user for a minute
#   ignore_mute: true fires even while the user is muted
#
# Owner commands in Discord (only works for the owner in settings.py):
#   !addreply word, some phrase | reply text or gif link   (attach an image to send it instead)
#   !delreply <name>    !replies    !reload    !shutup / !talk (unprompted AI replies)

